<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Library">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" id="icon" href="">
<title>My Library</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b1f;--mu:#6b6b76;--ac:#4f46e5;--bd:#e4e2dc;--dg:#d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111114;--card:#1b1b20;--tx:#f1f0f5;--mu:#9a9aa6;--ac:#8b85ff;--bd:#2c2c34}}
:root[data-theme=dark]{--bg:#111114;--card:#1b1b20;--tx:#f1f0f5;--mu:#9a9aa6;--ac:#8b85ff;--bd:#2c2c34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:84px}
header{padding:18px 16px 8px}h1{margin:0;font-size:28px}
.sub{color:var(--mu);font-size:14px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:4px 0 10px}
.search{margin:8px 16px;width:calc(100% - 32px)}
main{padding:0 16px}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.cv{width:52px;height:76px;border-radius:6px;background:linear-gradient(135deg,var(--ac),#a78bfa);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;object-fit:cover;flex:none}
.t{font-weight:600}.a{color:var(--mu);font-size:14px}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--dg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:12px;padding:6px}nav button.on{color:var(--ac)}nav span{display:block;font-size:22px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0004}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#sheet.on{display:flex}
#box{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
label{font-size:13px;color:var(--mu)}
video{width:100%;border-radius:12px;background:#000;max-height:260px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.msg{color:var(--mu);font-size:14px;padding:6px 0}.empty{text-align:center;color:var(--mu);padding:40px 10px}
</style></head><body>
<header><h1 id="h">My Library</h1><div class="sub" id="sub"></div></header>
<input class="search" id="q" type="search" placeholder="Search title, author, ISBN">
<main id="main"></main>
<button class="fab" id="fab" aria-label="Add book">+</button>
<nav id="nav"></nav>
<div id="sheet"><div id="box"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,mem={books:[],inbox:[]},tab='collection',cur=null,reader=null;
const rq=r=>new Promise(o=>{r.onsuccess=()=>o(r.result);r.onerror=()=>o()});
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const all=async s=>db?(await rq(st(s,'readonly').getAll()))||[]:mem[s];
const put=async(s,o)=>db?rq(st(s,'readwrite').put(o)):(mem[s]=mem[s].filter(x=>x.id!==o.id).concat(o));
const del=async(s,id)=>db?rq(st(s,'readwrite').delete(id)):(mem[s]=mem[s].filter(x=>x.id!==id));
const open=()=>new Promise(o=>{try{const r=indexedDB.open('mylib',1);r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('inbox',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;o()};r.onerror=()=>o()}catch(e){o()}});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function thumb(file,max=700){return new Promise(res=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};i.onerror=()=>res(null);i.src=u})}
// icon for Add to Home Screen
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#4f46e5';x.fillRect(0,0,180,180);x.font='110px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📚',90,98);$('#icon').href=c.toDataURL('image/png')})();
const tabs=[['collection','📚','Collection'],['wishlist','⭐','Wishlist'],['inbox','📷','Inbox'],['tools','💾','Backup']];
async function render(){
 $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('#h').textContent=tabs.find(t=>t[0]==tab)[2];
 const q=$('#q').value.toLowerCase(),M=$('#main');$('#q').style.display=(tab=='tools'||tab=='inbox')?'none':'';
 $('#fab').style.display=tab=='tools'?'none':'';
 if(tab=='inbox'){const p=await all('inbox');$('#sub').textContent=p.length+' photos waiting';
  M.innerHTML=(p.length?'<div class="grid">'+p.map(x=>`<img src="${esc(x.img)}" data-p="${x.id}">`).join('')+'</div><p class="msg">Tap a photo to identify it.</p>':'<div class="empty">No photos yet.<br>Tap + to batch-import shelf photos.</div>');return}
 if(tab=='tools'){$('#sub').textContent='Protect your collection';
  M.innerHTML=`<div class="row" style="display:block"><b>Export</b><p class="msg">Saves everything, including covers and inbox photos, as one JSON file.</p><div class="btns"><button id="dl">Download</button><button class="g" id="sh">Share / Save to Files</button><button class="g" id="cp">Copy</button></div>
  <b>Import</b><p class="msg">Restoring merges with what you already have.</p><input type="file" id="imp" accept=".json,application/json"><div class="msg" id="tm"></div></div>`;return}
 const b=(await all('books')).filter(x=>x.list==tab&&(!q||[x.title,x.author,x.isbn].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.title.localeCompare(b.title));
 $('#sub').textContent=b.length+(b.length==1?' book':' books');
 M.innerHTML=b.length?b.map(x=>`<div class="row" data-b="${x.id}">${x.cover?`<img class="cv" src="${esc(x.cover)}">`:`<div class="cv">${esc((x.title||'?')[0].toUpperCase())}</div>`}<div><div class="t">${esc(x.title)}</div><div class="a">${esc(x.author)}${x.year?' · '+esc(x.year):''}</div></div></div>`).join(''):`<div class="empty">Nothing here yet.<br>Tap + to add a book.</div>`;
}
const sheet=h=>{$('#box').innerHTML=h;$('#sheet').classList.add('on')};
const close=()=>{stopScan();$('#sheet').classList.remove('on');$('#box').innerHTML=''};
function form(b,pid){cur={...b};
 sheet(`<h2 style="margin:0 0 8px">${b.id?'Edit book':'Add book'}</h2>
 <div class="btns"><button class="g" id="sc">📷 Scan barcode</button><button class="g" id="bp">🖼 Batch photos</button></div><div id="scw"></div>
 <label>Title</label><input id="ti" value="${esc(b.title)}"><label>Author</label><input id="au" value="${esc(b.author)}">
 <label>ISBN</label><div style="display:flex;gap:8px"><input id="is" inputmode="numeric" value="${esc(b.isbn)}"><button class="g" id="lk" style="margin:4px 0 10px">Look up</button></div><div class="msg" id="ms"></div>
 <label>Year</label><input id="yr" inputmode="numeric" value="${esc(b.year)}"><label>List</label><select id="ls"><option value="collection">Collection</option><option value="wishlist">Wishlist</option></select>
 <label>Notes (edition, condition, where bought…)</label><textarea id="nt" rows="3">${esc(b.notes)}</textarea>
 <label>Cover artwork</label><input type="file" id="cf" accept="image/*"><div id="cvp">${b.cover?`<img class="cv" style="width:80px;height:116px" src="${esc(b.cover)}">`:''}</div>
 <div class="btns"><button id="sv">Save</button><button class="g" id="cl">Cancel</button>${b.id?'<button class="d" id="rm">Delete</button>':''}</div>`);
 $('#ls').value=b.list||(tab=='wishlist'?'wishlist':'collection');cur.pid=pid;if(b.id&&b.cover&&!b.coverSrc)cur.coverSrc='user';
}
function read(){return{...cur,title:$('#ti').value.trim(),author:$('#au').value.trim(),isbn:$('#is').value.replace(/[^0-9Xx]/g,''),year:$('#yr').value.trim(),list:$('#ls').value,notes:$('#nt').value}}
async function lookup(isbn){
 try{const j=await(await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn)).json(),v=j.items?.[0]?.volumeInfo;
  if(v)return{title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),year:(v.publishedDate||'').slice(0,4),cover:(v.imageLinks?.thumbnail||'').replace('http:','https:').replace('&edge=curl','').replace('zoom=1','zoom=2'),src:'Google Books'}}catch(e){}
 try{const j=await(await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json(),v=j['ISBN:'+isbn];
  if(v)return{title:v.title,author:(v.authors||[]).map(a=>a.name).join(', '),year:(v.publish_date||'').slice(-4),cover:v.cover?.medium||`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`,src:'Open Library'}}catch(e){}
 return null}
async function fill(isbn){const m=$('#ms');m.textContent='Looking up…';const r=await lookup(isbn);
 if(!r){m.textContent='No match (or lookups are blocked in this environment). You can enter details by hand.';return}
 if(!$('#ti').value)$('#ti').value=r.title;if(!$('#au').value)$('#au').value=r.author;if(!$('#yr').value)$('#yr').value=r.year;
 let cv=r.cover||`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`,got=false;
 if(cur.coverSrc!=='user'){try{const bl=await(await fetch(cv)).blob();if(bl.size>1500){cur.cover=await thumb(bl);got=true}}catch(e){}
  if(!got&&r.cover){cur.cover=r.cover;got=true}
  if(got){cur.coverSrc='lookup';$('#cvp').innerHTML=`<img class="cv" style="width:80px;height:116px" src="${esc(cur.cover)}">`}}
 m.textContent='Filled from '+r.src+(got?' (cover applied)':cur.coverSrc==='user'?' (kept your cover)':' (no cover found)')+' ✓'}
function stopScan(){try{reader&&reader.reset()}catch(e){}reader=null}
function scan(){const w=$('#scw');if(!window.ZXing){w.innerHTML='<div class="msg">Scanner library did not load. Type the ISBN instead.</div>';return}
 w.innerHTML='<video id="vd" playsinline muted></video><div class="msg">Point at the barcode on the back cover.</div>';
 reader=new ZXing.BrowserMultiFormatReader();
 reader.decodeFromConstraints({video:{facingMode:'environment'}},'vd',(r)=>{if(r){const t=r.getText();stopScan();w.innerHTML='';$('#is').value=t;fill(t.replace(/[^0-9Xx]/g,''))}}).catch(()=>{w.innerHTML='<div class="msg">Camera unavailable. Allow camera access, or type the ISBN.</div>'})}
async function batch(files){let n=0;for(const f of files){const img=await thumb(f,900);if(img){await put('inbox',{id:uid(),img,at:Date.now()});n++}}close();tab='inbox';render()}
function pick(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>batch([...i.files]);i.click()}
async function identify(id){const p=(await all('inbox')).find(x=>x.id==id);if(!p)return;
 sheet(`<img src="${esc(p.img)}" style="width:100%;border-radius:12px"><div class="btns"><button id="ia">Add as book</button><button class="g" id="is2">Try scanning barcode</button><button class="d" id="id">Remove</button><button class="g" id="cl">Close</button></div><div class="msg" id="ms"></div>`);
 $('#ia').onclick=()=>form({photo:p.img},p.id);
 $('#id').onclick=async()=>{await del('inbox',id);close();render()};
 $('#is2').onclick=async()=>{$('#ms').textContent='Reading barcode…';try{const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(p.img);const t=r.getText().replace(/[^0-9Xx]/g,'');form({photo:p.img,isbn:t},p.id);fill(t)}catch(e){$('#ms').textContent='No barcode found in this photo. Use "Add as book" and type the details.'}}}
async function dump(){return JSON.stringify({app:'mylib',v:1,at:new Date().toISOString(),books:await all('books'),inbox:await all('inbox')})}
document.addEventListener('click',async e=>{const t=e.target,id=t.id,d=t.closest('[data-t],[data-b],[data-p]');
 if(id=='fab'){tab=='inbox'?pick():form({list:tab})}
 else if(id=='cl')close();
 else if(id=='sc')scan();else if(id=='bp')pick();else if(id=='lk'){const i=$('#is').value.replace(/[^0-9Xx]/g,'');i?fill(i):$('#ms').textContent='Enter an ISBN first.'}
 else if(id=='sv'){const b=read();if(!b.cover&&b.photo)b.cover=b.photo;delete b.photo;if(!b.title){$('#ms').textContent='A title is required.';return}b.id=b.id||uid();const p=b.pid;delete b.pid;await put('books',b);if(p)await del('inbox',p);close();tab=b.list;render()}
 else if(id=='rm'){if(confirm('Delete this book?')){await del('books',cur.id);close();render()}}
 else if(id=='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await dump()],{type:'application/json'}));a.download='my-library-'+new Date().toISOString().slice(0,10)+'.json';a.click();$('#tm').textContent='If nothing downloaded, use Share or Copy.'}
 else if(id=='sh'){const f=new File([await dump()],'my-library.json',{type:'application/json'});try{navigator.canShare&&navigator.canShare({files:[f]})?await navigator.share({files:[f]}):await navigator.share({text:await dump()})}catch(x){$('#tm').textContent='Sharing unavailable. Try Copy.'}}
 else if(id=='cp'){try{await navigator.clipboard.writeText(await dump());$('#tm').textContent='Copied ✓'}catch(x){$('#tm').textContent='Copy blocked here.'}}
 else if(d?.dataset.t){tab=d.dataset.t;$('#q').value='';render()}
 else if(d?.dataset.b){form((await all('books')).find(x=>x.id==d.dataset.b))}
 else if(d?.dataset.p)identify(d.dataset.p);
 else if(t.id=='sheet')close()});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id=='cf'&&t.files[0]){cur.cover=await thumb(t.files[0]);cur.coverSrc='user';$('#cvp').innerHTML=`<img class="cv" style="width:80px;height:116px" src="${esc(cur.cover)}">`}
 if(t.id=='imp'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());for(const b of j.books||[])await put('books',b);for(const p of j.inbox||[])await put('inbox',p);$('#tm').textContent=`Imported ${(j.books||[]).length} books ✓`}catch(x){$('#tm').textContent='That file could not be read.'}}});
$('#q').addEventListener('input',render);
open().then(render);
</script></body></html>
